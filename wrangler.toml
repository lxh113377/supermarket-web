name = "supermarket-web"
compatibility_date = "2025-06-01"
pages_build_output_dir = "dist"

# 注意：管理密钥 ADMIN_KEY 不写入本文件（避免明文入库）。
# 生产：Cloudflare Dashboard → Pages 项目 → Settings → Variables and Secrets 添加 secret 型变量 ADMIN_KEY
#       或命令：wrangler pages secret put ADMIN_KEY --project-name=supermarket-web
# 本地开发：.dev.vars（已被 .gitignore 忽略）
[vars]
# 可追加的 CORS 白名单源（逗号分隔，可选；默认已含 pages.dev 与 github.io）
ALLOWED_ORIGINS = ""

# D1 数据库绑定（后端存储，替代原 CloudBase 文档库）
[[d1_databases]]
binding = "DB"
database_name = "supermarket"
database_id = "4bfc0283-d307-4285-9f02-dc230cfe4f5c"

# Workers KV 命名空间：限流计数（跨实例、可故障转移，消除限流与业务共用 D1 的单点；R3）
[[kv_namespaces]]
binding = "RATE_KV"
id = "47242e458b0e4922b0238f87e472f0d1"

# R2 对象存储：打印服务上传的文档/图片本体（2026-10-07 新增，端点 functions/upload.js）。
# D1 只存 `r2:<key>` 不透明引用，文件字节不进数据库。
# ⚠️ 启用前置：Cloudflare Dashboard 需先启用 R2（账号级开关，实测未启用时报 code:10042），
#    然后跑 `npx wrangler r2 bucket create supermarket-print-files`，再取消下面三行注释重新部署。
#    绑定缺席时 /upload 返回 print_storage_unavailable，前端自动降级为小文件内联提交
#    （单个 ≤512KB，见 src/utils/printUpload.ts）——功能不中断，只是大文件走微信补发。
# [[r2_buckets]]
# binding = "PRINT_FILES"
# bucket_name = "supermarket-print-files"
