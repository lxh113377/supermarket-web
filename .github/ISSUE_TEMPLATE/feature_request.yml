name: 功能建议
description: 提一个改进，但请先对齐本仓定位（校园单店 · 单人维护 · 微信入口 · 线下收款确认）
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
      本仓刻意**不做**多租户、真支付 SDK、优惠券/营销引擎、会员 CRM、物流跟踪 ——
      不是没实现，是场景不需要（见 `docs/adr/0001-order-fulfilment-state-machine.md`）。
      若你的建议落在这些方向，请一并说明它为什么对这个场景是必需的。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题（谁在什么情况下受困）
      placeholder: 例：新订单只能靠后台轮询 + 提示音，店主不在后台就漏单
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 越具体越好（涉及哪个接口/页面/表；是否需要新的 secret 或外部资源）
    validations:
      required: true
  - type: dropdown
    id: cost
    attributes:
      label: 你评估的额外代价
      options:
        - 无新依赖、无外部资源
        - 需要新的 Cloudflare 资源（R2 / Queues 等）
        - 需要外部服务（支付 / 短信 / 邮件 / 第三方 webhook）
        - 需要改生产 D1 数据（含迁移）
        - 不确定
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收判据（怎么算做完了）
      description: |
        本仓的规矩是"没有回归手段就不改"：请写一条可机器判定的验收，
        例如新增哪条测试、哪个门禁、线上核什么（sw.js 指纹 / /pub 条数 / ci:status）。
      placeholder: |
        1. tests/xxx.test.ts 覆盖"未配 secret 时不发且不改订单状态"；
        2. npm run verify 全绿；
        3. 线上 #/admin 看板无回归（体积 3/3、后端契约 109 断言）。
    validations:
      required: true
