# 依赖自动安全更新（2026-09-05 L3）
# weekly 频率，只开 npm 目录；group 依赖以减 PR 噪音。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
    ignore:
      # TS 7 / Vitest 5 为主版本前沿，升级需手工验证，不自动 PR（见 L3 备注）
      - dependency-name: "typescript"
      - dependency-name: "vitest"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3