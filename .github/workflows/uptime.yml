name: Uptime

# 生产定时探活（2026-09-18 双向迭代 R5 收尾）
# 替代 UptimeRobot：无需注册第三方，失败即 workflow 变红 → GitHub 自动给仓库 watcher 发邮件。
# 探活逻辑在 scripts/uptime-check.mjs（可本地 `node scripts/uptime-check.mjs` 直接验证）。
#
# 注意：
#   - schedule 仅在默认分支（main）生效；
#   - GitHub 的 cron 为 UTC，且高峰期可能有延迟（非分钟级 SLA）——如需分钟级告警，另接 UptimeRobot 等外部监控；
#   - 频率：每日 1 次（约 30 分钟 Actions 额度/月），故障发现依赖次日巡检；
#   - 本 workflow 不引用任何 secret（纯外部 HTTP 探测）。
on:
  schedule:
    # 每天一次（2026-09-18 定：日巡检定位，非分钟级 SLA）：
    # UTC 01:00 = 北京时间 09:00 —— GitHub cron 一律为 UTC。
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: uptime-check
  cancel-in-progress: false

# 最小权限原则（OpenSSF Token-Permissions）：探活只读代码，不授予写权限
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      # 固定到提交 SHA（OpenSSF Pinned-Dependencies）：防止上游标签被移动导致供应链投毒
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Probe production endpoints
        run: node scripts/uptime-check.mjs
