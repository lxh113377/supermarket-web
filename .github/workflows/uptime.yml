name: Uptime

# 生产定时探活（2026-09-18 双向迭代 R5 收尾）
# 替代 UptimeRobot：无需注册第三方，失败即 workflow 变红 → GitHub 自动给仓库 watcher 发邮件。
# 探活逻辑在 scripts/uptime-check.mjs（可本地 `node scripts/uptime-check.mjs` 直接验证）。
#
# 注意：
#   - schedule 仅在默认分支（main）生效；
#   - GitHub 的 cron 为 UTC，且高峰期可能有延迟（非分钟级 SLA）——如需分钟级告警，另接 UptimeRobot 等外部监控；
#   - 频率：每日 1 次（约 30 分钟 Actions 额度/月），故障发现依赖次日巡检；
#   - 本 workflow 不引用任何 secret（纯外部 HTTP 探测）。
on:
  schedule:
    # 每天一次（2026-09-18 定：日巡检定位，非分钟级 SLA）：
    # UTC 01:00 = 北京时间 09:00 —— GitHub cron 一律为 UTC。
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: uptime-check
  cancel-in-progress: false

# 最小权限原则（OpenSSF Token-Permissions）：探活只读代码，不授予写权限
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    # 本 job 除探活外还要读备份工作流的 run 历史（API 需 actions: read；
    # 只有 contents: read 时读 /actions/... 会 403 —— 第十一轮 pr-advisory 的同一课）。
    permissions:
      contents: read
      actions: read
    steps:
      # 固定到提交 SHA（OpenSSF Pinned-Dependencies）：防止上游标签被移动导致供应链投毒
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Probe production endpoints
        run: node scripts/uptime-check.mjs

      - name: Catalog facts (seed vs live, report only)
        # 第十一轮接成报告型（先量误报率）；本轮已拿到两次逐项一致的样本
        # （本机 + Uptime run 36240825097：28/54、漂移 27+1+22、重复 3+3），
        # 故摘掉 continue-on-error：**硬不变量违反即红**（exit 1），
        # 取不到数据也红（exit 2 BLOCKED）；漂移仍只打印不判红（脚本内部区分两类退出码）。
        run: npm run report:catalog

      - name: Backup chain liveness (did the nightly run really produce an artifact)
        # 只认 conclusion 会被骗：实测两次备份 run 都是 success，而导出/上传步骤全是
        # skipped、artifact 数为 0 ⇒ 生产库从未被这条链备份过。本步判"产物 + 新鲜度"。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BACKUP_SKIP_OK: ${{ vars.BACKUP_SKIP_OK }}
        run: npm run check:backup-liveness
