name: Dispatch deploy to github.io

# 微倈顾客端双发（R5 修复）：main 合并后向 lxh113377.github.io 的 Actions 部署发 event，
# github.io 仓库的 deploy.yml（repository_dispatch: supermarket-deploy）会 checkout 本仓库源码
# 重新构建并用 deploy-pages 发布（Pages 源=GitHub Actions）。
#
# 前置：需在仓库 Secrets 配置 GH_DISPATCH_TOKEN（PAT，repo 权限，能对 lxh113377.github.io
#       create repository_dispatch）。缺该 secret 时本 job 会失败（skipped 显示）。

on:
  push:
    branches: [main]

# 连续 push main 时取消旧 run，防止重复 dispatch 触发 github.io 侧并发构建
concurrency:
  group: dispatch-supermarket-web
  cancel-in-progress: true

# 最小权限原则（OpenSSF Token-Permissions）：本 workflow 只读代码，
# 跨仓 dispatch 用仓库 secret 里的 PAT，不授予 GITHUB_TOKEN 写权限。
permissions:
  contents: read

jobs:
  # 第十轮 R10-M2：报告型 advisory（永远 exit 0）。放这里而不是 ci.yml，因为 ci.yml 的 token
  # 只能 contents: read，调 GET /pulls 实测 403；本 job 有 GH_TOKEN 可用 gh 取 PR 列表。
  pr-advisory:
    name: PR test-coverage advisory (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # 实测：只有 contents: read 时 gh pr list 取不到列表（GET /pulls 需 pull-requests 读权，
    # 且 step 必须显式拿到 GH_TOKEN，否则 runner 上的 gh 未鉴权）。
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history for diff range)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Report which open PRs change code without touching tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run report:pr-tests
  dispatch:
    runs-on: ubuntu-latest
    # 第七十三轮 I-73-4：泛化时间上界判据之后被点名的一路（此前 dispatch.yml 两个 job 只有一个有界）。
    # 本 job 只做一次 repository_dispatch 投递，实测 4s 内完成
    # （`npm run ci:status` 读回：run 37747723744 的 dispatch job steps=3 secs=4）⇒ 取判据下界 5 分钟，
    # 已是实测的 75 倍；它若真跑到 5 分钟只能是卡在网络上，那正是该断的地方。
    timeout-minutes: 5
    steps:
      - name: Dispatch deploy event to github.io
        # 不再经 actions/github-script（v7 可用但 v9 实测假成功：workflow success 却不投递事件；
        # dependabot 会反复推 v9，钉死 v7 只是拖延。改直调 REST：行为与原来逐字段一致，
        # 少一个第三方 action 依赖，v9 问题从此无从复发。secret 只进 env，不进 argv/日志。
        env:
          DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then echo "missing secret GH_DISPATCH_TOKEN (repo-scoped PAT for lxh113377.github.io)" >&2; exit 1; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"event_type\":\"supermarket-deploy\",\"client_payload\":{\"ref\":\"$GITHUB_SHA\"}}" \
            https://api.github.com/repos/lxh113377/lxh113377.github.io/dispatches)
          echo "dispatch http=$code"
          [ "$code" = "204" ]
