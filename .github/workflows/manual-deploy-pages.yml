# 手动兜底部署：pages.dev ⇐ main HEAD（绕过 gates 的显式通道）
#
# 为什么需要它（不是绕过安全，而是绕过"凭据导致的闸死锁"）：
#   CI 的 gates 里 A11（d1 回执龄期）需要 CF Account Analytics:Read 才能刷新
#   docs/d1-remote-usage.json（见 rust/docs/15-deploy-round1.md §7）。该 scope 本机与
#   CI secret 都没有，于是 gates 恒红 ⇒ ci.yml 的 deploy job 恒 skipped ⇒ pages.dev
#   停在 2026-11-07 的 d89ddab。本 workflow 用与 ci.yml **完全相同**的构建参数在 CI 内
#   构建 main HEAD 产物，再用同一枚 CLOUDFLARE_API_TOKEN 部署，把"被凭据闸住的部署腿"
#   单独走通。判据不因此变绿：ci.yml 的 gates 仍然红，A11 仍然诚实地红。
#
# 纪律：
#   - 只 workflow_dispatch 手动触发，不挂 push/tag；每次运行都留 Actions 审计记录。
#   - 构建参数逐字照抄 ci.yml 的 Build step（含两个 VITE_CB_* 注入，坑 27）。
#   - 部署前把当前线上 production 版本打到日志里，回滚 = 用 ref=<旧提交 sha> 再跑一次本件。
#   - 冒烟失败则 job 红、并打印回滚命令，不静默。
name: Manual pages.dev refresh (gates-bypass, audited)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要部署的提交（默认 main；回滚时填上一个线上版本 sha，如 d89ddab）'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: manual-pages-refresh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 04b1466b2606b678a332fe6f26aa87ec
      DEPLOY_URL: https://supermarket-web.pages.dev
    steps:
      - name: Preflight（token 必须在，否则显式失败，别让"没配 secret"伪装成成功）
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 为空：本通道依赖仓库 secret，请先配置（需 Pages:Edit）"
            exit 1
          fi
          echo "token present (len=${#CLOUDFLARE_API_TOKEN})"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Show what we deploy
        run: |
          echo "target_ref=${{ inputs.ref }}"
          echo "checked_out_sha=$(git rev-parse HEAD)"
          echo "checked_out_short=$(git rev-parse --short=7 HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build（参数逐字照抄 ci.yml，坑 27：两个 VITE_CB_* 缺一个就产出未烘焙版）
        env:
          VITE_CB_API_BASE: https://supermarket-web.pages.dev/web
          VITE_CB_PUBLIC_API_BASE: https://supermarket-web.pages.dev/pub
        run: npm run build

      - name: Snapshot current production deployment（回滚锚点）
        run: |
          echo "--- current production deployments ---"
          npx wrangler pages deployment list --project-name supermarket-web 2>&1 | head -n 20 || true

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name supermarket-web

      - name: Smoke test（_health 的 deploy 字段必须等于本笔 sha）
        run: |
          set -e
          want="$(git rev-parse --short=7 HEAD)"
          echo "expect deploy=${want}"
          health="$(curl -fsS --retry 5 --retry-delay 3 "${DEPLOY_URL}/_health")"
          echo "health=${health}"
          echo "${health}" | grep -q ""deploy":"${want}"" && echo "OK deploy field matches" || {
            echo "::error::_health.deploy 不等于 ${want}（Pages 可能仍在分发旧版本），实测：${health}"; exit 1; }
          curl -fsS -X POST "${DEPLOY_URL}/pub" -H 'content-type: application/json' \
            -d '{"action":"getPublicCategories"}' | grep -q '"code":0' && echo "OK /pub code 0"
          code_71="$(curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "${DEPLOY_URL}/images/71.webp")"
          echo "images/71.webp => ${code_71}"
          echo "${code_71}" | grep -q '^200 image/webp' && echo "OK 71.webp real image" || echo "::warning::71.webp 形态异常：${code_71}"

      - name: Rollback hint on failure
        if: failure()
        run: |
          echo "::error::部署或冒烟失败。回滚命令（本机或本 workflow 重跑）："
          echo "  gh workflow run manual-deploy-pages.yml --ref <branch> -f ref=<上一个线上版本 sha>"
          echo "  上一线上版本 = 2026-11-07 的 d89ddab（部署前快照见上一步日志）"
