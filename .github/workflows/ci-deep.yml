name: CI Deep Gates

# 2026-10-08 分层 CI（用户拍板"动防护结构"）：
#   每笔 push 的阻断链收窄为 ci.yml 的快门禁（gates + e2e 三件套 + deploy），
#   本文件承载**深门禁**（跑得慢、或主要守 functions//db//scripts 的那些）：
#     · 触发：改动到 functions/db/scripts/docs/tests/workflows/lock 时随 push 跑，
#       另加每晚 03:20 UTC 全量兜底 + 手动触发。
#   防护语义（如实写，不留含糊）：
#     · 纯 src/**（顾客端前端）推送不再被深门禁挡部署 —— 深门禁的取数面本来就不读 src/**
#       （response/schema/roundtrips/authz/backend 全是 functions 侧），前端由 vitest+coverage、
#       e2e 三件套、smoke+自动回滚把守。
#     · 触碰 functions//db//scripts 的推送仍被深门禁挡住（本文件随 push 跑）。
#     · 本机 `npm run verify` 全链不变（本地仍是全量权威面）；`npm run preflight:ci`
#       覆盖快门禁尾部，深门禁部分在推送前可单独跑对应 verify:*。
# ⚠️ 本仓 tests/ciWorkflow.test.ts 钉死：除 ci.yml 外的 workflow 是独立链，禁止声明阻断依赖
#    （测试按文本匹配该关键字，故本注释也不直书那三个字母冒号），且所有 uses: 必须钉 40 位提交 SHA。

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'db/**'
      - 'scripts/**'
      - 'docs/**'
      - 'tests/**'
      - 'package-lock.json'
      - '.github/workflows/**'
  schedule:
    # 每晚 03:20 UTC（北京 11:20）：全量兜底，防"路径外改动累积漂移"
    - cron: '20 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-deep-supermarket-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deep-gates:
    runs-on: ubuntu-latest
    # 第七十三轮 I-73-4：深门禁链也要有时间上界（第七十二轮 §3 的 G-72-1 点名四个 workflow，
    # 当时只补了 ci.yml，本文件与 d1-backup / uptime 三个仍为 0 ⇒ "有界化"其实兑现了 1/4）。
    # 取值依据（一手，非拍脑袋）：`gh run list --workflow ci-deep.yml` 近 4 次全部 success，
    # run 级耗时 p95 = **0.6 分钟**；job 明细实测 deep-gates 23 步 / 30–33s。
    # 上界取 20 分钟 = p95 的 33 倍，与 ci.yml 的 `gates`（实测 87s 也给 20 分钟）同档，
    # 容得下一次冷 npm ci 与一次网络重取；本 job 里有多条联网判据（restore-drill / live-shape）。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 对标第二十七轮：action 响应形状契约（当年 39 个 action 里 12 个连成功形状都没被观测过；
      # 第三十四轮把具名缺口做到 0 条 ⇒ 现在这条判据守的是"漂移"与"新增可选字段必须登记"）
      - name: API response-shape contract gate
        run: npm run verify:response

      # 对标第二轮 A2：迁移引入的对象必须回写 schema.sql，否则测试库（verify-backend 每次
      # 从 schema.sql 重建 :memory:）与线上 D1 漂移——症状是"全绿但线上 no column named"。
      - name: Schema drift check (migrations vs schema.sql)
        run: npm run verify:schema

      - name: Migration replay and baseline reconstruction check
        run: npm run verify:migrate-replay

      # 对标第十四轮：一次业务动作打多少次 D1（往返斜率 + 免费档每调用查询数对账）
      - name: D1 round-trip complexity gate (slope vs input size)
        run: npm run verify:roundtrips

      # 对标第十五轮：只读密钥的写操作清单必须与「代码实际会改业务数据的 action」双向相等
      - name: Function-level authorization coverage gate
        run: npm run verify:authz

      # 第三十八轮：备份恢复的端到端闭环（合成 dump → 加密 → 解密 → 逐字节相等 → 交恢复判据）。
      # 跨机取回（真实产物）没有凭据时判 UNVERIFIED —— 记未验证，不折算成通过。
      - name: Backup restore drill (encrypt -> decrypt -> restore, no CF creds needed)
        run: npm run verify:restore-drill

      # 对标第二十四轮：CLI 入口真跑对账 —— 门禁脚本只被 import 纯函数不算被测，
      # 入口通道（读 stdin / 解析 git ref 行 / 退出码）必须至少有一次被当子进程真跑过。
      - name: CLI entrypoint real-run gate
        run: npm run verify:entrypoints

      # 对标第五十五轮 R55-H3：把 `spawnSync(..., {timeout})` 的空输出当结论的那类文件还剩几件。
      # 上限册 docs/cli-legs.json 的 `unguardedMax` 只准降不准升 ⇒ 新增一条裸腿当场判红。
      - name: CLI leg guard coverage gate (npm run verify:cli-legs)
        run: npm run verify:cli-legs

      # 对标第四十三轮 R43-P0 / 第四十四轮：静态推不出的"这判据会不会改写受版本控制的产物"，用真跑判。
      # CI 走 --blind-only（只测 import/形参/argv 那三类静态解不出的候选）。
      - name: Empirical artifact-write probe (blind candidates)
        run: npm run check:judge-side-effects -- --blind-only

      # 第八轮 H4（对标 microfeed 的 "Verify the Worker bundle"）：backend 契约 204 断言
      - name: Backend contract verify (node:sqlite mock D1)
        run: node scripts/verify-backend.mjs

      # —— 以下为 advisory（只报不拦），从 ci.yml 移入：它们要么要联网、要么在 CI 检出面恒 UNVERIFIED，
      #     每晚全量兜底 + 每次后端相关推送留痕即可，不必占用每笔推送的阻断链 ——

      # 对标第三十六轮：外层"工作区级记忆指针"是否跟上内层轮次（实测断更过 5 轮无人知）。
      - name: Workspace memory pointer sync (advisory)
        run: npm run verify:pointers

      # 第三十八轮：线上 /_health 的响应形状 ⇄ 本仓声明键集（只读 GET，advisory：发布在用户侧）。
      - name: Live endpoint shape vs declared keys (advisory)
        continue-on-error: true
        run: npm run check:live-shape

      # 对标第四十二轮 R42-H1：远端 D1 累计用量 ⇄ 本机下界对账（advisory）。
      - name: D1 remote cumulative usage vs local floor (advisory)
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: 04b1466b2606b678a332fe6f26aa87ec
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-d1-remote-usage.mjs

      # 对标第四十二轮：全部 schedule: 工作流的"最近一次"普查（advisory）。
      - name: Every scheduled workflow - is the LAST scheduled run green (advisory)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:cron-health

      # 对标第六十八轮 M-67-3：交付主张 ⇄ 远端回执对账（advisory；真正的阻断取数面在本机与每日 cron）。
      - name: Delivery claims (report only)
        continue-on-error: true
        run: npm run check:delivery-claims

      # 对标第三十三轮：用户侧安全设置普查（advisory，故意不阻断）。
      - name: Branch protection census (advisory)
        continue-on-error: true
        run: node scripts/check-branch-protection.mjs

  # ── 读数刷新：把「带时刻的committed 读数」的生产者接到调度上（治过期红 self-lock）───────
  # 立它的实测（不是推演）：`docs/d1-remote-usage.json` 的 `retrievedAtUtc` 停在 2026-10-06T00:32:22Z，
  # 而 `check-d1-roundtrips.mjs` 的 A11 里含「今天」（`REMOTE_MAX_AGE_DAYS=7`）⇒ 一个**什么都没改**的
  # 后续提交（`56d737c`，只往绕过台账追加 4 行）被它自己的 run `38464977451` 判 `gates=failure`。
  # 能把红治掉的那笔＝重生读数，而重生读数必须推在这块红基座上 ⇒ 按「别在红基座上叠加」永久进不去
  # （重跑那次 run 也变不了绿：过期读数就写在那个提交里）。
  # 正解是**补生产者，不是削尺**：A11 仍是硬闸，本 job 只保证它永远量不到 7 天那么老。
  # 三条设计约束（每条都有一手理由）：
  #   ① 只在 schedule / workflow_dispatch 跑 —— push 事件由 deep-gates 承担，本 job 不重复拿写权限。
  #   ② **取数失败绝不提交**：取数步骤 continue-on-error 只为了把红留在日志里，真正的闸门是下面那条
  #      「在册 verify 腿」—— 一次 CF 抖动若把 VERIFIED 覆盖成 UNREACHABLE，登记册声明会当场落后，
  #      下一个提交就又被判红 ⇒ 那等于把本 job 变成新的自锁源，所以宁可保留上一份新鲜读数。
  #   ③ 提交后必须显式触发一次 CI：GitHub 用 `GITHUB_TOKEN` 做的 push **不会**触发 workflow，
  #      而 `check-head-closure`/`ci-green-contract` 认的是「被推基座有没有回执」——一个没有 run 的
  #      bot 提交会把下一次人工推送判成 UNKNOWN 拦下，正是本 job 要消灭的那个形态。
  #      ref 形态由实测钉死：给 40 位 commit SHA 会被 API 拒 HTTP 422「No ref found」，只有分支名可用
  #      （2026-10-14 本机实测：SHA 拒 → 改 main 立刻建出 run 38481928532）⇒ 下面那一步按 main 触发。
  receipt-refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 一手依据：本 job = 一次冷 `npm ci` + D1 GraphQL 取数 + `gh` 逐条取 31 次 run 终态 + 两条判据实跑
    # （本机实测 0.42s / 0.14s，可忽略）。联网取数按"网络产物"给余量，取 15 分钟（在 [5,60] 档内）。
    timeout-minutes: 15
    permissions:
      # contents: write —— 写回读数；actions: write —— 最后那步要用 API 创建 workflow_dispatch 事件。
      # 后者不是猜的：dispatch 走的是 Actions 端点，GITHUB_TOKEN 在本 job 的 permissions 块被整体替换后
      # 若不点名 actions，那个 POST 就没有写权限（GitHub 官方 workflow_dispatch 端点说明只列了 classic token
      # 的 repo scope，未逐字印 actions:write ⇒ 本条按端点归属给权，真实回执看今晚调度后有没有产生 CI run）。
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Refresh D1 cumulative usage receipt
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: 04b1466b2606b678a332fe6f26aa87ec
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-d1-remote-usage.mjs --write

      - name: Refresh escape-hatch terminal readings
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-escape-hatch-log.mjs --update-remote

      # 闸门：读 `.ci/contract.json` 的 `receiptRecovery` 逐条实跑它登记的判据（同一事实只许一处判 ——
      # 这里不重抄文件名单，也不另定"什么算新鲜"）。任一条不绿 ⇒ 后面那步整步跳过，旧读数原样保留。
      - name: Run each registered receipt's verify leg
        id: verify
        continue-on-error: true
        run: |
          node --input-type=module -e '
          import { readFileSync } from "node:fs";
          import { spawnSync } from "node:child_process";
          const reg = (JSON.parse(readFileSync(".ci/contract.json", "utf8")).receiptRecovery) || [];
          if (!reg.length) { console.error("[refresh-gate] receiptRecovery 为空或未在册 ⇒ 不提交（通道没接线）"); process.exit(2); }
          let rc = 0;
          for (const r of reg) {
            const argv = String(r.verify).trim().split(/\s+/);
            const res = spawnSync(argv[0], argv.slice(1), { stdio: "inherit" });
            const code = res.error ? -1 : res.status;
            console.log("[refresh-gate] " + r.file + " -> rc=" + String(code));
            if (code !== 0) rc = 1;
          }
          process.exit(rc);
          '

      - name: Commit refreshed receipts (only changed paths, only when the gate is green)
        id: commit
        if: steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PATHS="docs/d1-remote-usage.json docs/escape-hatch-remote.json"
          if git diff --quiet -- $PATHS; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "[refresh] 两份读数与提交面逐字节相同 ⇒ 不制造空提交"
            exit 0
          fi
          git diff --name-only -- $PATHS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $PATHS
          git commit -m "chore(cron): 每晚刷新两份带时刻的读数 —— 让过期红没有出生的机会

          由 ci-deep.yml 的 receipt-refresh job 生成。A11（check-d1-roundtrips.mjs）与 C9
          （check-escape-hatch-log.mjs）判的都是读数龄期，7 天保险丝一到就把下一个**内容无关**的
          提交判红，而治红的提交又必须推在那块红基座上（一手：run 38464977451）。
          本 job 只在两条在册 verify 腿都 rc=0 时才提交 —— 取数失败一律保留上一份新鲜读数。"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 上面那条 push 用的是 GITHUB_TOKEN ⇒ GitHub 不会为它启动任何 workflow。不补这一脚，
      # 远端 main 的尖端就长期处于"没有回执"态，下一次人工推送会被判 UNKNOWN 拦下（同本 job 要治的病）。
      - name: Trigger CI on main for the pushed commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 经 env 传值而不是在 run: 里内联 ${{ }} —— 本仓 tests/ciWorkflow.test.ts 有注入扫描腿
          REFRESHED_SHA: ${{ steps.commit.outputs.SHA }}
        run: |
          # 实测（2026-10-14 本机）：`gh workflow run ci.yml --ref <40位SHA>` 回 HTTP 422
          # `No ref found for: 68ddb9a2...`；同一命令换 `--ref main` 立刻建出 run 38481928532。
          # 所以这里按**分支名**触发：本步刚刚把 REFRESHED_SHA 推成 main 的尖端，
          # 若中途有别人抢先推过，我们上面那次 push 就已经非快进失败、根本走不到这一步。
          gh workflow run ci.yml --ref main
          echo "[refresh] 已对 main 触发一次 CI，期望覆盖的 sha=$REFRESHED_SHA"
          echo "[refresh] 为什么必须补这一脚：GITHUB_TOKEN 的 push 本身不启动 workflow ⇒"
          echo "[refresh] 远端尖端会长期处于「没有回执」态，下次人工推送被 ci-green-contract 判 UNKNOWN 拦下。"

      # 响亮失败腿（一手：run 38483138112 / job 115590281378 实测）。上面闸门把 blind 读数拦在外面是对的，
      # 但那次跑完整个 job 报的是 **success**：取数步与闸门步都带 continue-on-error，后两步记 skipped
      # ⇒ `check-cron-health` 会把一个"什么都没刷新的夜更"读成健康，7 天保险丝照样再爆，而这次连报警都没有。
      # 闸门的"拒"必须是可见的失败，否则这条链越安静，下一次过期红来得越准。
      # 分档（不许把两档折成一档）：读数逐字节相同（不制造空提交）⇒ 仍算成功；取不到/在册判据仍红 ⇒ 判红。
      - name: Fail loudly when the gate refused to refresh
        if: steps.verify.outcome != 'success'
        run: |
          echo "::error::[refresh] 在册 verify 腿未全绿 ⇒ 本夜更**没有**刷新任何读数（原文见上一步的 rc 与 A11/U3）。"
          echo "[refresh] 实测最可能形态：CF 令牌对该账户无 GraphQL 读权限"
          echo "[refresh]   （run 38483138112 原文：graphql=UNREACHABLE reason=authz not authorized for that account）。"
          echo "[refresh] 为什么这里不静默：读数无人喂 ⇒ 判据里的「今天」迟早跨线，"
          echo "[refresh]   而那块红基座又会把下一次人工推送锁死（原病 run 38464977451）。"
          exit 1
