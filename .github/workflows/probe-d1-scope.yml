name: Probe D1 scope (temporary)

# 一次性探针：专门回答「仓库已有的 CLOUDFLARE_API_TOKEN 是否具备 D1:Read」。
# 为什么必须在这跑：secret 的值读不到，本地探只能证明本机的 token。
# 只看 HTTP 状态码与 success/errors 字段；不打印 token（GitHub 也会自动掩码）。
# 用完即删（临时仪器不留在仓里）。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /d1/database with the existing token
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: 04b1466b2606b678a332fe6f26aa87ec
        run: |
          set -euo pipefail
          if [ -z "${T:-}" ]; then echo "PROBE token-absent"; exit 1; fi
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database")
          echo "PROBE http=$code"
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/out.json'))
          print('PROBE success=', d.get('success'))
          print('PROBE errors=', [e.get('code') for e in (d.get('errors') or [])])
          r = d.get('result') or []
          print('PROBE databases=', len(r) if isinstance(r, list) else 'n/a')
          PY
