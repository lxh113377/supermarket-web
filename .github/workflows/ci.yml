name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一 workflow 组内：连续 push main 时取消旧 run，防止两次 deploy job 并发导致旧构建覆盖新构建。
# ⚠️ 必须按 ref 分组（2026-09-24 治本）：固定组名会让 PR run 与 main run 互相取消
# （dependabot 多 PR 场景 5/5 全卡 unstable，即部署 skill §2.1 实测坑#1 的根因修复）
concurrency:
  group: ci-supermarket-web-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则（OpenSSF Token-Permissions）：本 workflow 只读代码，
# 部署用凭据一律走 secrets，不授予 GITHUB_TOKEN 任何写权限。
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # 固定到提交 SHA（OpenSSF Pinned-Dependencies）：防止上游标签被移动导致供应链投毒
      # fetch-depth: 0（六轮实测必需）：CHANGELOG 门禁要比对上一个提交 / PR base，
      # 默认 depth=1 时 CI 里没有 HEAD~1 对象 → 门禁连续两轮误红（拒绝放行的 fail-closed
      # 行为被浅克隆触发）。仓库仅 117 提交 / 13MB，全量拉取成本可忽略。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 对标第二轮 A3（2026-09-24）：依赖漏洞审计进阻断门禁。
      # 显式 --registry=npmjs 是本机/镜像源的必需项——npmmirror 未实现 audit 端点
      # （实测返回 NOT_IMPLEMENTED），不指 registry 会让审计静默拿不到数据。
      # 端点故障时 npm audit 以非 0 退出（不假绿）；high/critical 阻断，moderate 打印留痕。
      #
      # 第六十六轮的**分面**（不是降档）：阻断腿只判 `--omit=dev`＝发布产物真含的那张依赖图。
      # 一手事实：本仓 5 条 high 全在 tailwindcss(dev)→chokidar→braces 这条**构建期**链上，
      # 且 braces 在该 advisory 下**没有任何已修版本**（实测 `npm view braces versions` 最新即 3.0.3，
      # 而已装的就是 3.0.3 ⇒ `braces *` 受影响），npm 给的唯一"修"是 tailwindcss 3→4 的 major。
      # 判据不许逼一次无人评审的框架大迁移，也不许为此把 audit-level 调高——两腿都印才叫对账。
      # 可利用性口径（写死以便被反驳）：braces 那条是**深度嵌套 glob 模式致栈耗尽（DoS）**，
      # 输入面是仓内静态的 `tailwind.config.js content` 模式，不接受外部输入 ⇒ 运行期不可达。
      # 下一腿（full tree）仍逐条印出这 5 条 high + echarts 的 moderate，具名欠账见
      # docs/dependency-audit.md（生产腿红=拦，开发腿红=记）。
      - name: Dependency audit (production tree, high+) — 阻断
        run: npm run audit:deps

      - name: Dependency audit (full tree incl. dev toolchain) — 只报不拦
        continue-on-error: true
        run: npm run audit:deps:full

      - name: Secret scan
        run: node scripts/scan-secrets.mjs

      - name: Lint (oxlint)
        run: npm run lint

      # 第八轮 M2（收第七轮 K7）：Windows/macOS 大小写不敏感文件系统上，新建文件会
      # 静默覆盖同名异Case的已跟踪文件（第七轮实测：productsTab.test.tsx 吃掉 ProductsTab 的 4 例，
      # git status 只显示一个 M）。Linux runner 上两者本是两个文件 ⇒ 本地全绿 CI 收两套。
      - name: File-name case collision check
        run: npm run verify:case

      - name: Env var registry gate (code vs docs/env-vars.md)
        run: npm run verify:env

      - name: Static HTML CSP gate (no dead inline styles)
        run: npm run verify:csp

      # 第四十八轮 R48-H1：`verify:images` 此前既不在 verify 链也不在 CI（workflows 引用 0 处），
      # 而且它的 `main()` 从不 sys.exit ⇒ **缺图也 rc=0**。本轮同时补退出码与接线；
      # 接线的唯一命令形态仍是 `npm run verify:images`（别名只有一处真相源），
      # Linux runner 上没有 `python` 只有 `python3` ⇒ 用 setup-python 把解释器补齐，而不是在 CI 里另写一条 python3 命令。
      - name: Set up Python (product image assets gate)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Product image assets gate (npm run verify:images)
        run: npm run verify:images

      - name: Line-ending purity gate (npm run verify:eol)
        # 第五十一轮 R51-H6。.gitattributes 是**配置位**，光"文件在册"不等于生效 —— 这一步是它的
        # 行为回执：问 git `check-attr` 怎么答、逐字节扫 index 侧 blob 有没有 CRLF，并拿
        # `git ls-files --eol` 当第二条通道对账（两条不一致 ⇒ 判红，不许任何一侧宣布"干净"）。
        # 判的是 blob 侧（git 决定的量）⇒ 与 runner 的 core.autocrlf 无关，换机器可复算。
        run: npm run verify:eol

      - name: Test (vitest, with v8 coverage)
        # 一次跑测兼产出覆盖率（避免全量套件跑两遍）；失败仍然阻断
        run: npx vitest run --coverage

      - name: Typecheck
        run: npm run typecheck

      # 对标 P1-B2（2026-09-24）：本地 verify 链的 check:cycles / verify:contract 此前只在
      # npm run verify 手动跑，CI 不拦 → 循环依赖或契约文档漂移可以静默进 main。
      - name: Import cycle check
        run: npm run check:cycles

      - name: API contract drift check
        run: npm run verify:contract

      # 对标第二十七轮：action 响应形状契约（当年 39 个 action 里 12 个连成功形状都没被观测过；
      # 第三十四轮把具名缺口做到 0 条 ⇒ 现在这条判据守的是"漂移"与"新增可选字段必须登记"）
      - name: API response-shape contract gate
        run: npm run verify:response

      # 对标第三十五轮：登记表 ⇄ 生产者（代码分发面）双向差集。
      # 立它的一手事实：docs/sql-baseline.json 43 键 vs 分发面 39 条，4 个键长期没人解释，
      # 其中 amortized:audit-retention-purge 迟到 6 轮才入册；反向（登记有、代码已无）此前无人守。
      - name: Registry-producer two-way sync gate
        run: npm run verify:registry

      # 第八轮 H2：README/ARCHITECTURE 里可静态派生的数字（action 数、覆盖率棘轮阈值、
      # 单测文件数、文档内链）必须等于真相源。实测抓到的漂移：`/web 30 action`（契约 31）、
      # 手写徽章 `tests-176 passed`（同文件另一行写 631）。对标 microfeed 的 `docs:check` step。
      - name: Doc facts consistency gate
        run: npm run verify:docs

      # 对标第二轮 A2：迁移引入的对象必须回写 schema.sql，否则测试库（verify-backend 每次
      # 从 schema.sql 重建 :memory:）与线上 D1 漂移——症状是"全绿但线上 no column named"。
      - name: Schema drift check (migrations vs schema.sql)
        run: npm run verify:schema

      - name: Migration replay and baseline reconstruction check
        run: npm run verify:migrate-replay

      # 对标第十四轮：一次业务动作打多少次 D1（往返斜率 + 免费档每调用查询数对账）
      - name: D1 round-trip complexity gate (slope vs input size)
        run: npm run verify:roundtrips

      # 对标第十五轮：只读密钥的写操作清单必须与「代码实际会改业务数据的 action」双向相等
      - name: Function-level authorization coverage gate
        run: npm run verify:authz

      # 对标第十七轮：每个数值上限必须能追到一个真实约束（平台事实/列定义/产品决定）
      - name: Numeric limit provenance gate
        run: npm run verify:limits

      # 对标第十八轮：失败必须携带机器可读 errorCode + 语义 HTTP 状态（把"库存不足被判成网络故障"这条链钉死）
      - name: Error semantics registry gate
        run: npm run verify:errors

      # 第三十八轮：备份恢复的端到端闭环（合成 dump → 加密 → 解密 → 逐字节相等 → 交恢复判据）。
      # 立它的实测：在册写"verify:restore 需 CF 凭据故恒红"，本轮用本机 dump 实跑判 OK ⇒ 演练不需要云凭据。
      # 跨机取回（真实产物）没有凭据时判 UNVERIFIED —— 记未验证，不折算成通过。
      - name: Backup restore drill (encrypt -> decrypt -> restore, no CF creds needed)
        run: npm run verify:restore-drill

      # 对标第二十轮：个人数据登记册 ⇄ schema 全量列双向对账，并与导出面白名单互锁
      - name: PII inventory gate
        run: npm run verify:pii

      # 对标第二十四轮：CLI 入口真跑对账 —— 门禁脚本只被 import 纯函数不算被测，
      # 入口通道（读 stdin / 解析 git ref 行 / 退出码）必须至少有一次被当子进程真跑过。
      # 立它的原因：ci-green-contract 的 stdin 读取抛 ReferenceError 被空 catch 吞掉，
      # 15 条夹具全绿，闸门却把每一次推送都审成 contract 默认分支。
      - name: CLI entrypoint real-run gate
        run: npm run verify:entrypoints

      # 对标第五十五轮 R55-H3：把 `spawnSync(..., {timeout})` 的空输出当结论的那类文件还剩几件。
      # 分母由 AST 现取（文本级检测器对带解构默认值的签名整片失明，本轮一手：它把 24 位点的文件判成"无包装器"）；
      # 风险位点只算**带 timeout** 的 spawn（不带 timeout 产不出 `status===null`，算进去就是虚报欠账）。
      # 上限册 docs/cli-legs.json 的 `unguardedMax` 只准降不准升 ⇒ 新增一条裸腿当场判红，既存欠账逐轮清偿。
      - name: CLI leg guard coverage gate (npm run verify:cli-legs)
        run: npm run verify:cli-legs

      # 对标第四十三轮 R43-H1：文档里印的命令有没有跟真相源对过账（别名册 ⇄ package.json ⇄ 盘上文件）。
      # 立它的事实：`docs/implementation-plan-2026-08-08.md` 里三条 `npm run predeploy` 是 CloudBase 时代的
      # 死命令，盘上 61 个别名根本没有它 —— 而此前任何门禁都不读文档正文。历史面走"带到期时刻的归档面"，
      # 不做永久豁免；README 的门禁一览由本判据 `--update` 生成，D6 判它不许漂。
      - name: Documented commands vs real aliases
        run: npm run check:doc-commands -- --check

      # 对标第四十三轮 R43-P0 / 第四十四轮：静态推不出的"这判据会不会改写受版本控制的产物"，用真跑判。
      # CI 走 --blind-only（只测 import/形参/argv 那三类静态解不出的候选）：全量面本机实测 9 件 ≈300s，
      # 每件都要解一份 git archive 快照再跑两趟，不适合放在每次推送的必需 job 里；缩面后的取数面印在
      # 门面行上，S3/S5 对"本轮没敲那扇门"的对象记未复核而不记幽灵（假红会把闸变成噪音）。
      - name: Empirical artifact-write probe (blind candidates)
        run: npm run check:judge-side-effects -- --blind-only

      # 对标第三十一轮：记忆卷 4KB 上限的仓内闸（借 pre-commit/pre-commit-hooks 的 check-added-large-files
      # 形态：阈值显式 + 默认只管要提交的面；CI 这条走 --all 全量面，所以外部 handoff.py 只是报告型也不裸奔）
      - name: Memory volume budget gate
        run: npm run verify:volume

      # 对标第三十六轮：外层"工作区级记忆指针"是否跟上内层轮次（实测断更过 5 轮无人知）。
      # 该目录在代码仓之外 ⇒ CI 里必然取不到，判据对此只报 UNVERIFIED 且 rc=0（不阻断、也不假装核过）；
      # 真正会红的是本地 `npm run verify`——那才是它设计时要守的现场。
      # 第三十八轮：线上 /_health 的响应形状 ⇄ 本仓声明键集（只读 GET，advisory：发布在用户侧）。
      # 立它的事实：本仓 _health.js:4 自述 deploy 字段就是为了发现"改了没部署"，却从来没有东西做这个比对。
      - name: Live endpoint shape vs declared keys (advisory)
        continue-on-error: true
        run: npm run check:live-shape

      # 对标第四十二轮 R42-H1：远端 D1 累计用量 ⇄ 本机下界对账（advisory，同 Branch-Protection 的取舍：
      # 取不到读数时判据自己 rc=2 记 UNREACHABLE，绝不折算成"配额安全"；红了不拦发布，但每轮在日志留痕）。
      # 两通道 = GraphQL Analytics（UTC 日界，配额 00:00 UTC 重置）+ `wrangler d1 info`（滚动 24h）。
      - name: D1 remote cumulative usage vs local floor (advisory)
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: 04b1466b2606b678a332fe6f26aa87ec
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-d1-remote-usage.mjs

      - name: Workspace memory pointer sync (advisory)
        run: npm run verify:pointers

      # 对标第四十二轮：全部 schedule: 工作流的"最近一次"普查（advisory）。
      # 为什么不阻断（写下来，不留"以后再说"）：本轮实测 2 条 cron 的最近一次 scheduled run **都是红的**，
      # 根因是用户侧凭据（CF_D1_BACKUP_TOKEN / BACKUP_PASSPHRASE）没配 —— 判据本身没错，
      # 但在凭据配上之前把它接成阻断位，会让每个 push 连带变红（全仓连坐，见 docs/ci-triage-runbook.md）。
      # 已按在册口径登记为"具名 + 限期 + 理由可证伪"的豁免（docs/cron-health.json，至 2026-10-12）；
      # 真正的阻断位在 uptime.yml（每日那条 cron 自己跑它，红了就落在 cron 的日志里）。
      - name: Every scheduled workflow - is the LAST scheduled run green (advisory)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:cron-health

      # 对标第三十三轮：用户侧安全设置普查（advisory，故意不阻断）——借 ossf/scorecard 的 Branch-Protection
      # 形态，但取不到时绝不按"满足"计：四态 ENFORCED / NOT_ENFORCED / UNVERIFIED + 时刻，每轮在 CI 日志留痕，
      # 免得"分支保护还没开"这件事只活在报告作者的记忆里。runner 上的 token 无 admin ⇒ 预期读数是 UNVERIFIED。
      - name: Branch protection census (advisory)
        continue-on-error: true
        run: node scripts/check-branch-protection.mjs

      # 对标第三轮 C2：生产依赖（含传递）license 白名单，拦 GPL/AGPL 类传染（本项目 MIT 发布）
      - name: Production license gate
        run: npm run verify:licenses

      # 对标第五轮 F2：改了 src/functions 必须带 CHANGELOG 条目（changesets 思想个人化；--relaxed 留 hotfix 逃生门且 CI 留痕）
      # 第八轮 M1：push 事件此前固定 HEAD~1 ⇒ 一次 push 多提交时只校验末位那个，
      # "把 src 改动藏在一个纯 docs 的末位提交后面"即可免门禁。这里把 webhook 的 before 传进去。
      - name: CHANGELOG entry gate
        run: npm run verify:changelog
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

      # 第五十三轮 E3：逃生门计量。`CI_GREEN_SKIP` 绕过绿契约时必须往 .ci/escape-hatch.jsonl 追加一行，
      # 这一步核整本账（字段齐全 / 理由够长 / sha 形状合规）。离线可判 ⇒ 既能进本机 verify 链也能进 CI；
      # 刻意**不判**"绕过之后远端有没有回绿"（那要联网，做成阻断项就成了不可自愈的闸）。
      - name: Escape-hatch ledger gate (npm run verify:escape-hatch)
        run: npm run verify:escape-hatch

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build
        # 坑27 防线（2026-09-05）：dist 由 deploy job 复用，此处必须烘焙线上端点，
        # 否则发布的是"local demo mode"未烘焙版（本文件任何 Build 步骤都需注入这两项）。
        run: npm run build
        env:
          VITE_CB_API_BASE: https://supermarket-web.pages.dev/web
          VITE_CB_PUBLIC_API_BASE: https://supermarket-web.pages.dev/pub

      # 体积预算（P1-B2）：build 之后按 gzip 首屏体积卡阈值，防体积悄悄回归
      - name: Bundle size budget (gzip, first-load)
        run: node scripts/check-bundle-size.mjs

      # 第五十二轮交付、第五十三轮 E2 接线：聚合预算之外的**分项**预算（每个 chunk 一条 limit + 未登记面地板）。
      # 必须排在 Build 之后 —— 输入面是 dist/assets；本机 verify 链里没有 build，所以它不进那条链（理由见脚本头注）。
      # 地板只准降不准升：升=新增 chunk 家族没进名册，处置是补登记（带当次实测时刻）或复用既有 pattern，
      # 禁把 docs/item-budgets.json 的 noBudgetMax 调高求绿。
      - name: Per-chunk size budgets (npm run report:item-budgets)
        run: npm run report:item-budgets

      # 第八轮 H4（对标 microfeed 的 "Verify the Worker bundle"）：npm run build 只编译 src/，
      # functions/ 完全在 vite 视野之外 —— 此前绑定名写错/入口语法坏要等到 wrangler 真部署才炸。
      # 反例已实跑：往 functions/ 放一个 import 缺失模块的文件 → Could not resolve + 非零退出；
      # 另把 functions/_health.js 改名 → 结构断言报「找不到路由字面量 /_health」（exit 1）。
      - name: Pages Functions deployable-artifact check (compile, no deploy)
        run: npm run verify:functions

      - name: Backend contract verify (node:sqlite mock D1)
        run: node scripts/verify-backend.mjs

      # M5（2026-09-05）：构建产物上传，deploy job 复用，避免重复 npm ci + build（CI 时长约减 1/3）
      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  # 端到端冒烟（对标 P0-A3）：跑在 dev server 的本地演示模式，不依赖后端与 D1。
  # 2026-09-24 起移除 continue-on-error，但当时 deploy.needs 只有 build-and-test ⇒ 本 job 红了
  # 仍然照常部署，"阻断性门禁"那句 CHANGELOG/ci.yml 注释与实际不符（本轮 K2 才真正接入 needs）。
  # 改页面结构/文案需同步更新 tests/e2e/。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke
        run: npm run test:e2e

      - name: Upload playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 3

  # 云端模式真渲染门禁（防线轮 K2）：生产构建 + 假桩 /web，断看板四张图真的画出 canvas
  # 且全程零未捕获异常。存在的理由就是 2026-09-24 那起 P0：echarts 深路径模块零 export 被喂进
  # core.use() → TypeError 落在无 catch 的 async IIFE 里 → 四图线上静默空白 19 天，
  # 而单测/契约/e2e 全绿。这类缺陷只有"真浏览器 + 真生产包 + 真 echarts"看得见。
  # 反例已实跑：把 useDashboardCharts 的 core.use 改回旧写法，本 job 报
  # 「宿主内没有 canvas（静默空白回归）」与 pageerror「e.install is not a function」。
  # 密钥：桩对任意非空密钥放行，生产密钥不进 CI 日志也不进产物。
  # 不跑 verify:changelog ⇒ 无需 fetch-depth: 0（该门禁只在 build-and-test 跑）。
  # 不定义 job 级 concurrency：继承 workflow 级按 ref 分组（固定组名会让 PR 与 main 互砍）。
  # 回滚（若本 job 误拦部署）：把下面 deploy 的 needs 改回 build-and-test 一项即可退回非阻断。
  e2e-cloud-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # webServer 自带 build:stub，产物在本 job 内现建（dist-stub 是 gitignored 派生件）
      - name: Run cloud-mode e2e (stub backend)
        run: npm run test:stub

      - name: Upload playwright stub report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-stub-report
          path: playwright-report-stub
          if-no-files-found: ignore
          retention-days: 3

  # 第八轮 M4：视觉/可访问性层（16 条：AA 对比度、键盘焦点环、CLS 友好固有尺寸、
  # 1440/768/390 三档无横向溢出、图区底板一致性）此前只在本地跑，改样式没有任何机器拦。
  # 跑生产构建（dev 下 CSP 会拦 vite 注入的 <style>，几何判据结构上不可能通过），
  # webServer 自带 build，产物本 job 现建。
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual & a11y assertions
        run: npm run test:visual

      - name: Upload playwright visual report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-visual-report
          path: playwright-report-visual
          if-no-files-found: ignore
          retention-days: 3

  # 自动部署管理端+API 到 Cloudflare Pages（supermarket-web.pages.dev）
  # 仅 main push 触发（PR 不部署）；需仓库 Secrets 配置 CLOUDFLARE_API_TOKEN（Pages:Edit 权限）。
  # 未配置 token 时 Deploy step 跳过（不标红），配置后 push main 即自动部署。
  # 注意：secrets 上下文不能在 job 级 if 使用（会导致 workflow 解析失败），只能在 step 级判断。
  # 与 dispatch.yml（github.io 顾客端双发）互不冲突：本 job 直推 pages.dev，dispatch 走 repository_dispatch。
  deploy:
    # 防线轮 K2 起接三个：build-and-test（单测/契约/门禁）+ e2e（dev 演示模式功能冒烟）
    # + e2e-cloud-stub（生产构建真渲染）。此前 needs 只有 build-and-test ⇒ e2e 红了照样部署，
    # 属"判据假安全感"（2026-09-24 那起 19 天空白事故的检测失效模式）。
    # 第八轮 M4 加入 visual（生产构建上的布局/对比度/焦点环 16 条），改样式自此有红绿可言。
    needs: [build-and-test, e2e, e2e-cloud-stub, visual]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # L2 候选：可改 secret 收敛；当前保持常量现状（改 secret 需先在仓库配置，否则部署失败）
      CLOUDFLARE_ACCOUNT_ID: 04b1466b2606b678a332fe6f26aa87ec
      DEPLOY_URL: https://supermarket-web.pages.dev
    steps:
      # 坑#30 修复（2026-09-08，M5 回归）：wrangler pages deploy 依赖工作目录的
      # functions/（自动打包为 Pages Functions）与 wrangler.toml（D1/KV 绑定、pages_build_output_dir）。
      # M5 只下载 dist artifact 缺这两者 → 纯静态部署，POST 全 405、绑定全丢，且 smoke 失败无法自动回滚。
      # 故 deploy 前必须 checkout 源码（仅拉一次浅克隆，体积开销可忽略）。
      - name: Checkout source (functions/ + wrangler.toml required)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # M5：直接复用 build-and-test 的 dist（含构建期注入的 VITE_* env），无需重新 npm ci + build
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler pages deploy dist --project-name supermarket-web

      # M5：部署后在线冒烟（_health 探活 + 公开接口契约抽查），第一时间暴露"构建成功但线上异常"（坑27 防线）
      # 坑#30 后续加固（2026-09-08）：smoke 失败 → 自动回滚上一生产部署（下方 rollback step，仅此处触发）
      - name: Smoke test deployed API
        id: smoke
        if: env.CLOUDFLARE_API_TOKEN != ''
        shell: bash
        run: |
          set -e
          echo "== _health =="
          curl -fsS "$DEPLOY_URL/_health" || { echo "::error::_health 探活失败"; exit 1; }
          echo "== getPublicCategories 契约 =="
          curl -fsS -X POST "$DEPLOY_URL/pub" \
            -H 'Content-Type: application/json' \
            -d '{"action":"getPublicCategories","payload":{}}' \
            | grep -q '"code":0' || { echo "::error::公开接口契约失败"; exit 1; }
          echo "SMOKE OK"

      # 坑#30 后续加固：仅当"部署成功但 smoke 验证失败"时回滚到上一生产部署。
      # 触发条件 = failure() && steps.smoke.outcome == 'failure'——build/download/deploy 自身失败不触发
      #（那些场景生产未被本次改动污染，无需回滚）。
      # 第九轮 R9-H2 的双端一致性判据已搬走（此位置被 CI 首跑证明是错的）：
      # 顾客端链路（dispatch.yml → 对端 deploy.yml 重建 → CDN 传播）与本 deploy job 并行，
      # pages.dev 刚部完那一刻，github.io 按定义仍是上一批构建（实测复取 247s 仍不一致）。
      # 现位于 .github/workflows/release-parity.yml：CI 完成后独立触发 + 长阶梯 + 只报警不回滚。
      # 本 job 只保留一件事：本端线上冒烟（失败才回滚）。

      # 回滚目标 = 部署列表（时间倒序、仅 production）中排除当前版本后的第一个（即上一部署）。
      # 回滚后必须复验（与 smoke 同款判定）；复验失败 = 连续坏版本，升级人工告警（下方 step）。
      # 注意：回滚成功也不改变 job 失败态（smoke 已红）——回滚是止损，不是掩盖，需人工知悉复盘。
      - name: Rollback to previous deployment (smoke failed)
        id: rollback
        if: failure() && steps.smoke.outcome == 'failure'
        shell: bash
        run: |
          set -e
          echo "::error::Smoke 验证失败，开始自动回滚到上一生产部署"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/supermarket-web/deployments"
          PREV_ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=10" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const ds=(j.result||[]).filter(d=>d.environment==='production');if(ds.length<2){console.error('无上一生产部署可回滚');process.exit(1)}console.log(ds[1].id)})")
          echo "回滚目标部署: $PREV_ID"
          curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/$PREV_ID/rollback" -o /dev/null
          echo "回滚指令已下发，等待边缘传播..."
          sleep 15
          echo "== 回滚后复验 =="
          curl -fsS --retry 3 --retry-delay 5 "$DEPLOY_URL/_health"
          curl -fsS --retry 3 --retry-delay 5 -X POST "$DEPLOY_URL/pub" \
            -H 'Content-Type: application/json' \
            -d '{"action":"getPublicCategories","payload":{}}' \
            | grep -q '"code":0'
          echo "ROLLBACK OK: 生产已回滚至 $PREV_ID 且复验通过"

      # 回滚本身失败或回滚后复验仍失败（连续坏版本）→ 显式人工介入告警，防止静默异常
      - name: Rollback failed (manual intervention required)
        if: failure() && steps.rollback.outcome == 'failure'
        run: |
          echo "::error::自动回滚执行/复验失败——生产可能仍处于异常状态，需立即人工介入：Cloudflare Dashboard → Pages → supermarket-web → Deployments → 手动回滚到最后一个健康版本"
