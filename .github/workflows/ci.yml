name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一 workflow 组内：连续 push main 时取消旧 run，防止两次 deploy job 并发导致旧构建覆盖新构建
concurrency:
  group: ci-supermarket-web
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: node scripts/scan-secrets.mjs

      - name: Lint (oxlint)
        run: npm run lint

      - name: Test (vitest)
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Backend contract verify (node:sqlite mock D1)
        run: node scripts/verify-backend.mjs

  # 自动部署管理端+API 到 Cloudflare Pages（supermarket-web.pages.dev）
  # 仅 main push 触发（PR 不部署）；需仓库 Secrets 配置 CLOUDFLARE_API_TOKEN（Pages:Edit 权限）。
  # 未配置 token 时 Deploy step 跳过（不标红），配置后 push main 即自动部署。
  # 注意：secrets 上下文不能在 job 级 if 使用（会导致 workflow 解析失败），只能在 step 级判断。
  # 与 dispatch.yml（github.io 顾客端双发）互不冲突：本 job 直推 pages.dev，dispatch 走 repository_dispatch。
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 04b1466b2606b678a332fe6f26aa87ec
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler pages deploy dist --project-name supermarket-web
