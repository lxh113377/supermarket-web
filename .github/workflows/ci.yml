name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: node scripts/scan-secrets.mjs

      - name: Lint (oxlint)
        run: npm run lint

      - name: Test (vitest)
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Backend contract verify (node:sqlite mock D1)
        run: node scripts/verify-backend.mjs
