name: D1 Daily Backup

on:
  schedule:
    - cron: '0 20 * * *'   # UTC 20:00 = 北京 04:00（低峰）
  workflow_dispatch:

# 最小权限：本 workflow 只读代码，导出物进 artifact（私有仓内）
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Detect backup token
        id: tok
        # 坑26 先例：secrets 判断放 step 级 env，不放 job 级 if（job 级 if 用 secrets 会导致 workflow 解析失败）
        env:
          CF_TOKEN: ${{ secrets.CF_D1_BACKUP_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 CF_D1_BACKUP_TOKEN（需 D1:Read 权限的 API Token），本次备份跳过"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Export remote D1
        if: steps.tok.outputs.found == 'true'
        run: npx wrangler d1 export supermarket --remote --output d1-backup.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_D1_BACKUP_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 04b1466b2606b678a332fe6f26aa87ec

      - name: Upload backup artifact
        if: steps.tok.outputs.found == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: d1-backup-${{ github.run_number }}
          path: d1-backup.sql
          retention-days: 30
          if-no-files-found: error
