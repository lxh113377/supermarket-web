name: D1 Daily Backup

on:
  schedule:
    - cron: '0 20 * * *'   # UTC 20:00 = 北京 04:00（低峰）
  workflow_dispatch:

# 最小权限：本 workflow 只读代码。
# ⚠️ 仓库已于 2026-09-25 转 public ⇒ artifact 的可见面从"仅协作者"扩到"任意已登录 GitHub 用户"
#    （实测：未鉴权下载仍被拒 —— REST `/actions/artifacts/{id}/zip` 返回 401、
#     web UI download 路径返回 404；但带任意用户 token 或网页登录后即可取）。
#    生产库全量导出物不能放到这里 ⇒ 下面 visibility 守卫在非私有仓时**响亮失败**。
#    两条出路（择一后再解守卫）：① 仓库转回 private；② 上传前用 age/openssl 加密，
#    并另配一个只用于解密口令的 secret —— 绝不允许"明文导出 + 公开仓"同时成立。
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    # 本 job 除备份外还要反查巡检链是否还在跑（API 需 actions: read）
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Detect backup token
        id: tok
        # 坑26 先例：secrets 判断放 step 级 env，不放 job 级 if（job 级 if 用 secrets 会导致 workflow 解析失败）
        env:
          CF_TOKEN: ${{ secrets.CF_D1_BACKUP_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 CF_D1_BACKUP_TOKEN（需 D1:Read 权限的 API Token），本次备份跳过"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      # 守卫必须排在导出**之前**：一旦 public 仓配了备份 token，宁可红也不要落下可被任意读者取走的全库明文。
      # 判据取 API 实答而非 github.event 上下文：schedule 触发的 payload 里 repository 字段形态不稳，
      # 按"取不到数据就失败"处理（禁把上下文缺失误判成"通过"）。
      - name: Refuse plaintext backup artifact on a non-private repo
        if: steps.tok.outputs.found == 'true'
        shell: bash
        env:
          GH_API: https://api.github.com/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          body=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$GH_API") \
            || { echo "::error::读不到仓库可见性（API 失败）——fail-closed，不放行备份"; exit 1; }
          priv=$(printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(typeof j.private==='boolean'?String(j.private):'unknown')})")
          if [ "$priv" != "true" ]; then
            echo "::error title=备份已拦下·仓库非私有(private=$priv)::CF_D1_BACKUP_TOKEN 已配置，但本仓不是 private ⇒ 全库明文导出物进 artifact 后任意已登录 GitHub 用户都能下载。处置见本文件顶部注释的两条出路（转回 private / 先加密再上传）。"
            exit 1
          fi
          echo "仓库为 private，允许落 artifact"

      - name: Cross-check the daily probe is still running
        # 第十二轮：三条 cron 两两互指。GitHub 官方行为——public 仓 60 天无仓库活动会
        # **自动禁用 schedule**；任一条停摆，另一条要当场红，否则又是「绿色的沉默」。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LIVENESS_WORKFLOW_ID: uptime.yml
          LIVENESS_MODE: presence
          LIVENESS_MAX_AGE_DAYS: '3'
        run: npm run check:backup-liveness

      - name: Fail loudly instead of reporting a green no-op
        # 实况（第十二轮）：未配 token 时以前只发一条 ::warning::，后面两步全 skipped，
        # job 仍 success ⇒ 连续两晚"绿色的零备份"。沉默跳过不是状态，是缺陷。
        # 要显式接受"暂时不备份"就设仓库变量 BACKUP_SKIP_OK=true（降级为豁免态，但仍会打印事实）。
        env:
          FOUND: ${{ steps.tok.outputs.found }}
          SKIP_OK: ${{ vars.BACKUP_SKIP_OK }}
        run: |
          set -euo pipefail
          ok=$(printf '%s' "${SKIP_OK:-}" | tr 'A-Z' 'a-z')
          if [ "$FOUND" != "true" ] && [ "$ok" != "true" ]; then
            echo "::error title=备份链没在工作::未配置 CF_D1_BACKUP_TOKEN ⇒ 导出与上传都会被跳过，本 run 不会产出任何可核对的备份产物。要么配 token（并先解决下方"非 private 不放行"守卫的两条出路），要么显式设仓库变量 BACKUP_SKIP_OK=true 承认暂时不备份。"
            exit 1
          fi
          echo "found=$FOUND skip_ok=${ok:-false}（后者为 true 时是显式豁免，不是沉默）"

      - name: Export remote D1
        if: steps.tok.outputs.found == 'true'
        run: npx wrangler d1 export supermarket --remote --output d1-backup.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_D1_BACKUP_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 04b1466b2606b678a332fe6f26aa87ec

      - name: Restore drill (load dump into throwaway in-memory sqlite)
        # 第十一轮 R11-H1：未验证过"能恢复"的备份只是愿望。必须排在上传之前——
        # 过不了的 dump 不该被当成备份留着（判据含 integrity_check / 外键 / 表集对账 / 行数==文本语句数 / 目录非空）。
        env:
          BACKUP_SQL: d1-backup.sql
        run: npm run verify:restore

      - name: Upload backup artifact
        if: steps.tok.outputs.found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d1-backup-${{ github.run_number }}
          path: d1-backup.sql
          retention-days: 30
          if-no-files-found: error
