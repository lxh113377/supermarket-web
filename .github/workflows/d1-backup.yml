name: D1 Daily Backup

on:
  schedule:
    - cron: '0 20 * * *'   # UTC 20:00 = 北京 04:00（低峰）
  workflow_dispatch:

# 最小权限：本 workflow 只读代码。
# ⚠️ 仓库已于 2026-09-25 转 public ⇒ artifact 的可见面从"仅协作者"扩到"任意已登录 GitHub 用户"
#    （实测：未鉴权下载仍被拒 —— REST `/actions/artifacts/{id}/zip` 返回 401、
#     web UI download 路径返回 404；但带任意用户 token 或网页登录后即可取）。
#    生产库全量导出物不能放到这里 ⇒ 下面 visibility 守卫在非私有仓时**响亮失败**。
#    三条出路：① 仓库转回 private；② **先加密再上传**（第三十七轮已实现：配 `BACKUP_PASSPHRASE`
#    secret 即可，产物名带 -enc 后缀，见 scripts/backup-crypto.mjs 的文件头口径）；③ 换存储位置（用户侧）。
#    无论如何，**"明文导出 + 公开仓"仍不允许同时成立** —— 守卫顺序没动，只是多了一条可通过的路径。
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    # 第七十三轮 I-73-4：备份链补时间上界。取值依据（一手）：近 16 次 run 耗时 p95 = **0.8 分钟**
    # （其中 14 次 failure 是 CF_D1_BACKUP_TOKEN 缺位那条在册红，见 docs/cron-health.json，与时长无关）。
    # 上界取 10 分钟 = p95 的 12 倍：本 job 真配好 token 后要导出整库 + 加密 + 传 artifact，
    # 那是它第一次真跑，没有历史读数可依 ⇒ 按"数据量未知的网络产物"给余量，不按 p95×3 卡死它。
    timeout-minutes: 10
    # 本 job 除备份外还要反查巡检链是否还在跑（API 需 actions: read）
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Detect backup token
        id: tok
        # 坑26 先例：secrets 判断放 step 级 env，不放 job 级 if（job 级 if 用 secrets 会导致 workflow 解析失败）
        env:
          CF_TOKEN: ${{ secrets.CF_D1_BACKUP_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 CF_D1_BACKUP_TOKEN（需 D1:Read 权限的 API Token），本次备份跳过"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect decrypt passphrase secret
        id: pw
        # 只输出**存在性**：口令本身一旦 echo 就进 CI 日志 = 泄露（判据一律走 env，禁命令行传参）。
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then echo "found=false" >> "$GITHUB_OUTPUT"; else echo "found=true" >> "$GITHUB_OUTPUT"; fi

      # 守卫必须排在导出**之前**：一旦 public 仓配了备份 token，宁可红也不要落下可被任意读者取走的全库明文。
      # 判据取 API 实答而非 github.event 上下文：schedule 触发的 payload 里 repository 字段形态不稳，
      # 按"取不到数据就失败"处理（禁把上下文缺失误判成"通过"）。
      # 第三十七轮起这是**三态**判定而不是二态拦死：private→明文放行；非 private 且有口令→加密放行；
      # 非 private 且无口令→红（绝不静默改成"那就明文吧"）。
      - name: Decide artifact disposition (private / encrypted / refuse)
        id: disp
        if: steps.tok.outputs.found == 'true'
        shell: bash
        env:
          GH_API: https://api.github.com/repos/${{ github.repository }}
          PW_FOUND: ${{ steps.pw.outputs.found }}
        run: |
          set -euo pipefail
          body=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$GH_API") \
            || { echo "::error::读不到仓库可见性（API 失败）——fail-closed，不放行备份"; exit 1; }
          priv=$(printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(typeof j.private==='boolean'?String(j.private):'unknown')})")
          if [ "$priv" = "true" ]; then
            echo "mode=plaintext" >> "$GITHUB_OUTPUT"
            echo "仓库 private ⇒ 允许明文产物落 artifact"
          elif [ "$PW_FOUND" = "true" ]; then
            echo "mode=encrypted" >> "$GITHUB_OUTPUT"
            echo "仓库非 private(private=$priv) 且已配 BACKUP_PASSPHRASE ⇒ 走加密出路，产物落 d1-backup.sql.smbk"
          else
            echo "::error title=备份已拦下·非私有仓且没有解密口令(private=$priv)::CF_D1_BACKUP_TOKEN 已配置，但本仓不是 private 且缺 BACKUP_PASSPHRASE secret ⇒ 全库明文导出物进 artifact 后任意已登录 GitHub 用户都能下载（见 actions/upload-artifact README:123）。三条出路：① 仓库转回 private；② 配 BACKUP_PASSPHRASE（本仓 scripts/backup-crypto.mjs 会自动加密，恢复用 npm run backup:decrypt）；③ 换私有存储。绝不允许「明文导出 + 公开仓」同时成立。"
            exit 1
          fi

      - name: Fail loudly instead of reporting a green no-op
        # 实况（第十二轮）：未配 token 时以前只发一条 ::warning::，后面两步全 skipped，
        # job 仍 success ⇒ 连续两晚"绿色的零备份"。沉默跳过不是状态，是缺陷。
        # 要显式接受"暂时不备份"就设仓库变量 BACKUP_SKIP_OK=true（降级为豁免态，但仍会打印事实）。
        env:
          FOUND: ${{ steps.tok.outputs.found }}
          SKIP_OK: ${{ vars.BACKUP_SKIP_OK }}
        run: |
          set -euo pipefail
          ok=$(printf '%s' "${SKIP_OK:-}" | tr 'A-Z' 'a-z')
          if [ "$FOUND" != "true" ] && [ "$ok" != "true" ]; then
            echo "::error title=备份链没在工作::未配置 CF_D1_BACKUP_TOKEN ⇒ 导出与上传都会被跳过，本 run 不会产出任何可核对的备份产物。要么配 token（并先解决下方"非 private 不放行"守卫的两条出路），要么显式设仓库变量 BACKUP_SKIP_OK=true 承认暂时不备份。"
            exit 1
          fi
          echo "found=$FOUND skip_ok=${ok:-false}（后者为 true 时是显式豁免，不是沉默）"

      - name: Export remote D1
        if: steps.tok.outputs.found == 'true'
        run: npx wrangler d1 export supermarket --remote --output d1-backup.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_D1_BACKUP_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 04b1466b2606b678a332fe6f26aa87ec

      - name: Restore drill (load dump into throwaway in-memory sqlite)
        # 第十一轮 R11-H1：未验证过"能恢复"的备份只是愿望。必须排在上传之前——
        # 过不了的 dump 不该被当成备份留着（判据含 integrity_check / 外键 / 表集对账 / 行数==文本语句数 / 目录非空）。
        env:
          BACKUP_SQL: d1-backup.sql
        run: npm run verify:restore

      - name: Encrypt dump before it leaves the runner
        id: enc
        if: steps.disp.outputs.mode == 'encrypted'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          node scripts/backup-crypto.mjs --encrypt d1-backup.sql d1-backup.sql.smbk
          # 自证 1：产物确实成了密文（inspect 只读头，不涉口令）
          node scripts/backup-crypto.mjs --inspect d1-backup.sql.smbk
          # 自证 2（关键）：解回来与原文逐字节比对 —— **产物存在不等于备份可用**，
          # 口令配错/容器损坏若留到真要恢复那天才发现，就等于没有备份。
          node scripts/backup-crypto.mjs --verify d1-backup.sql d1-backup.sql.smbk
          # 上传面只留密文：明文从工作区摘掉，防将来有人把 upload 的 path 改成通配就顺手带走明文
          rm -f d1-backup.sql
          test ! -e d1-backup.sql || { echo "::error::明文导出物没摘干净 ⇒ 拒继续"; exit 1; }

      - name: Upload backup artifact (plaintext · private repo)
        id: upPlain
        if: steps.tok.outputs.found == 'true' && steps.disp.outputs.mode == 'plaintext'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d1-backup-${{ github.run_number }}
          path: d1-backup.sql
          retention-days: 30
          if-no-files-found: error

      - name: Upload backup artifact (encrypted · non-private repo)
        id: upEnc
        if: steps.disp.outputs.mode == 'encrypted'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d1-backup-enc-${{ github.run_number }}
          path: d1-backup.sql.smbk
          retention-days: 30
          if-no-files-found: error

      # 第六十八轮：这一步**必须排在导出与上传之后**。
      # 它原来排在 `Export remote D1` 之前，而判据当时要求对侧是绿的 ⇒ 两条 cron 互为前提成环：
      # 探活要绿得先有备份产物，备份要产出得先探活是绿的 —— 于是配了 token 也永远备份不了
      # （一手实测 run 37241500391：本步 failure、`Export remote D1` skipped）。
      # 判据侧同步改成「只证到点跑没跑、颜色降成可见读数」；这里是**双保险**：
      # 就算对侧真停摆，本步只把它自己的红留在日志里，不再否决备份产出。
      - name: Cross-check the daily probe is still running
        # 第十二轮立的原意：GitHub 对 public 仓「60 天无仓库活动自动禁用 schedule」，
        # 任一条**停摆**时另一条要当场红，否则又是「绿色的沉默」。注意它说的是停摆，不是颜色——
        # 实现跑偏成"必须 success"就是本轮修的病。
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LIVENESS_WORKFLOW_ID: uptime.yml
          LIVENESS_MODE: presence
          # 不再传 LIVENESS_MAX_AGE_DAYS：presence 的龄期由**对侧 cron 的周期推导**（日 cron ⇒ ≤3 天），
          # 留在这里是一处永远不会被读的死配置（第六十八轮，与判据同批改）。
        run: npm run check:backup-liveness

      - name: Post-check — 非私有仓只允许加密产物落地
        # 两半互斥 if 保证"加密模式下明文那步不可能被上传"；本步再把**结果**核一遍，
        # 防的是将来有人给上传步骤加第三个 fallback 而把这条链拆掉（守卫在，但没人验证它跑过）。
        if: always() && steps.disp.outputs.mode == 'encrypted'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.upEnc.outcome }}" != "success" ]; then
            echo "::error title=加密产物没落地::mode=encrypted 但加密上传未成功（outcome=${{ steps.upEnc.outcome }}）⇒ 备份链不能算工作，别把它记成已备份"
            exit 1
          fi
          if [ -n "${{ steps.upPlain.outcome }}" ] && [ "${{ steps.upPlain.outcome }}" != "skipped" ]; then
            echo "::error title=明文产物出现在非私有仓::明文上传步骤 outcome=${{ steps.upPlain.outcome }}（应为 skipped）"
            exit 1
          fi
          echo "OK 非私有仓下只产出了加密产物 d1-backup-enc-${{ github.run_number }}"
